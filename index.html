<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VETA NFC</title>

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7429GHXMBM"></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());

    gtag('config', 'G-7429GHXMBM');
  </script>

</head>

<body>

<div id="resultado" style="
  font-family: Arial;
  text-align: center;
  padding: 50px;
">

  <h1>VETA NFC</h1>
  <p>Procesando tarjeta...</p>

</div>

<script>

  const cards = {

    "veta-01": {
      id: "VETA-01",
      name: "Arturo"
    },

    "veta-02": {
      id: "VETA-02",
      name: "Carol"
    },

    "veta-03": {
      id: "VETA-03",
      name: "Valentina"
    },

    "veta-04": {
      id: "VETA-04",
      name: "Dario"
    },

    "veta-05": {
      id: "VETA-05",
      name: "Belen"
    }

  };


  const params = new URLSearchParams(
    window.location.search
  );

  const nfc = params.get("nfc");

  const card = cards[nfc];


  if (card) {

    document.getElementById("resultado").innerHTML = `
      <h1>NFC detectado ✅</h1>

      <p><strong>Tarjeta:</strong> ${card.id}</p>

      <p><strong>Nombre:</strong> ${card.name}</p>

      <p><strong>ID:</strong> ${nfc}</p>

      <p style="color:green;">
        Enviando evento a Google Analytics...
      </p>
    `;


    setTimeout(function() {

      gtag('event', 'nfc_tap', {

        restaurant: 'veta',

        restaurant_name:
          'VETA Grill Steakhouse Barcelona',

        card_id: card.id,

        card_name: card.name,

        nfc_id: nfc,

        source: 'nfc',

        debug_mode: true

      });

      console.log("NFC_TAP ENVIADO", card);

      document.getElementById("resultado").innerHTML += `
        <p style="color:green;">
          ✅ nfc_tap enviado
        </p>
      `;

    }, 3000);


  } else {

    document.getElementById("resultado").innerHTML = `
      <h1>VETA NFC</h1>

      <p>No se detectó ninguna tarjeta.</p>
    `;

  }

</script>

</body>
</html>
