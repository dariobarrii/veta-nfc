<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VETA NFC</title>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7429GHXMBM"></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());

    gtag('config', 'G-7429GHXMBM');

    const params = new URLSearchParams(window.location.search);
    const nfc = params.get("nfc");

    const cards = {
      "veta-01": ["VETA-01", "Arturo"],
      "veta-02": ["VETA-02", "Carol"],
      "veta-03": ["VETA-03", "Valentina"],
      "veta-04": ["VETA-04", "Dario"],
      "veta-05": ["VETA-05", "Belen"]
    };

    const card = cards[nfc];

    if (card) {

      gtag('event', 'nfc_tap', {
        restaurant: 'veta',
        restaurant_name: 'VETA Grill Steakhouse Barcelona',
        card_id: card[0],
        card_name: card[1],
        nfc_id: nfc,
        source: 'nfc',
        debug_mode: true
      });

      document.body.innerHTML =
        "<h1>NFC detectado</h1>" +
        "<p>Tarjeta: " + card[0] + "</p>" +
        "<p>Nombre: " + card[1] + "</p>";
    }
  </script>

</head>

<body>
</body>
</html>
